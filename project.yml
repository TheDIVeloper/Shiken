name: Shiken
options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: com.shiken
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Shiken macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets
    settings:
      base:
        PRODUCT_NAME: Shiken
        PRODUCT_MODULE_NAME: ShikenMac
        PRODUCT_BUNDLE_IDENTIFIER: com.shiken.Shiken.mac
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Shiken
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Shiken"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  Shiken iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets
    settings:
      base:
        PRODUCT_NAME: Shiken
        PRODUCT_MODULE_NAME: ShikenIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.shiken.Shiken.ios
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Shiken
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO

  ShikenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Shiken macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiken.ShikenTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shiken.app/Contents/MacOS/Shiken"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Shiken macOS:
    build:
      targets:
        Shiken macOS: all
    run:
      config: Debug
  Shiken iOS:
    build:
      targets:
        Shiken iOS: all
    run:
      config: Debug
  Shiken Tests:
    build:
      targets:
        Shiken macOS: [test]
        ShikenTests: [test]
    test:
      config: Debug
      targets:
        - ShikenTests